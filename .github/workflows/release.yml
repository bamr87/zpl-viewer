name: Release

# Scaffolded by tools/adopt-release.sh — Conventional Commits drive release-please
# (opens a release PR that bumps the version + CHANGELOG); merging it tags, releases,
# and publishes. Shared logic lives in bamr87/.github. See release-please-config.json.

on:
  push:
    branches: [main]

# Serialize release-please: back-to-back merges to main (e.g. two dependabot
# merges seconds apart) otherwise race each other updating the release PR.
# Queue, never cancel — every main push must still be observed by release-please.
concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bamr87/.github/.github/workflows/release-please.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: bamr87/.github/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
