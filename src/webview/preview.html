<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data: blob:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}' 'unsafe-eval'; font-src {{cspSource}} data:;"
    />
    <title>ZPL Preview</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
        background: var(--vscode-editor-background);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBar-background);
        position: sticky;
        top: 0;
        z-index: 1;
        flex-wrap: wrap;
      }
      button {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        padding: 4px 10px;
        border-radius: 2px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { background: var(--vscode-button-hoverBackground); }
      .spacer { flex: 1; }
      #status {
        font-size: 11px;
        opacity: 0.8;
      }
      main {
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: auto;
      }
      canvas {
        background: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        image-rendering: pixelated;
      }
      .bootmsg {
        padding: 16px;
        font-size: 13px;
        white-space: pre-wrap;
        color: var(--vscode-descriptionForeground);
      }
      .err {
        color: var(--vscode-errorForeground);
        font-family: var(--vscode-editor-font-family, monospace);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button data-cmd="prev" title="Previous label">◀</button>
      <span id="page-indicator">0 / 0</span>
      <button data-cmd="next" title="Next label">▶</button>
      <button data-cmd="zoom-out" title="Zoom out">−</button>
      <button data-cmd="zoom-reset" title="Reset zoom">100%</button>
      <button data-cmd="zoom-in" title="Zoom in">+</button>
      <button data-cmd="refresh" title="Refresh">Refresh</button>
      <button data-cmd="export-png" title="Export this label as a PNG image">PNG</button>
      <button data-cmd="export-pdf" title="Export every label as a multi-page PDF">PDF</button>
      <button data-cmd="export-svg" title="Export this label as vector SVG">SVG</button>
      <button data-cmd="actions" title="Every Label Studio action">⋯</button>
      <span class="spacer"></span>
      <span id="status">Initializing…</span>
    </div>
    <main>
      <div id="boot" class="bootmsg">Loading renderer…</div>
      <canvas id="label" width="1" height="1" style="display:none"></canvas>
    </main>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
